<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI',system-ui,sans-serif;">
  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="700">MITRE ATT&amp;CK FOR ICS: SALDIRI YAŞAM DÖNGÜSÜ</text>
  <text x="460" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">İlk Girişten Fiziksel Etkiye (Cyber-to-Physical) Adım Adım Tehdit İlerlemesi</text>

  <!-- Step 1: Initial Access -->
  <g transform="translate(30, 80)">
    <rect width="155" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="155" height="35" rx="10" fill="#0369a1"/>
    <text x="77" y="22" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1. SIZMA &amp; ERİŞİM</text>
    <text x="12" y="58" fill="#38bdf8" font-size="10" font-weight="600">• Initial Access</text>
    <text x="12" y="74" fill="#cbd5e1" font-size="9">Zıpkınla Avlama (Phishing)</text>
    <text x="12" y="90" fill="#cbd5e1" font-size="9">VPN / Uzaktan Erişim</text>
    <text x="12" y="106" fill="#cbd5e1" font-size="9">Tedarikçi Girişleri</text>
    <text x="12" y="126" fill="#94a3b8" font-size="9">Hedef: Kurumsal IT / IDMZ</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 190 155 L 210 155" stroke="#64748b" stroke-width="2"/>

  <!-- Step 2: Lateral Movement -->
  <g transform="translate(210, 80)">
    <rect width="155" height="150" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="155" height="35" rx="10" fill="#4338ca"/>
    <text x="77" y="22" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2. YANAL GEÇİŞ</text>
    <text x="12" y="58" fill="#a5b4fc" font-size="10" font-weight="600">• Lateral Movement</text>
    <text x="12" y="74" fill="#cbd5e1" font-size="9">IDMZ Jump Box Sızıntısı</text>
    <text x="12" y="90" fill="#cbd5e1" font-size="9">Mühendislik İstasyonu (EWS)</text>
    <text x="12" y="106" fill="#cbd5e1" font-size="9">SCADA Sunucu Yetkisi</text>
    <text x="12" y="126" fill="#94a3b8" font-size="9">Hedef: Seviye 3 / 2</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 370 155 L 390 155" stroke="#64748b" stroke-width="2"/>

  <!-- Step 3: Discovery & Tampering -->
  <g transform="translate(390, 80)">
    <rect width="155" height="150" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect width="155" height="35" rx="10" fill="#b45309"/>
    <text x="77" y="22" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3. KEŞİF &amp; LOJİK</text>
    <text x="12" y="58" fill="#fde047" font-size="10" font-weight="600">• Program Download</text>
    <text x="12" y="74" fill="#cbd5e1" font-size="9">PLC Taraması (S7/Modbus)</text>
    <text x="12" y="90" fill="#cbd5e1" font-size="9">Zararlı Ladder Logic</text>
    <text x="12" y="106" fill="#cbd5e1" font-size="9">Parametre Değiştirme</text>
    <text x="12" y="126" fill="#94a3b8" font-size="9">Hedef: Seviye 1 (PLC/RTU)</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 550 155 L 570 155" stroke="#64748b" stroke-width="2"/>

  <!-- Step 4: Inhibit Response -->
  <g transform="translate(570, 80)">
    <rect width="155" height="150" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <rect width="155" height="35" rx="10" fill="#c2410c"/>
    <text x="77" y="22" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4. EMNİYETİ FELÇ ET</text>
    <text x="12" y="58" fill="#fdba74" font-size="10" font-weight="600">• Inhibit Response</text>
    <text x="12" y="74" fill="#cbd5e1" font-size="9">SIS Korumasını Devre Dışı Bırak</text>
    <text x="12" y="90" fill="#cbd5e1" font-size="9">Alarm Sistemini Sustur</text>
    <text x="12" y="106" fill="#cbd5e1" font-size="9">Sahte Telemetri Bas</text>
    <text x="12" y="126" fill="#94a3b8" font-size="9">Hedef: Emniyet Katmanı</text>
  </g>

  <!-- Arrow 4-5 -->
  <path d="M 730 155 L 750 155" stroke="#ef4444" stroke-width="2"/>

  <!-- Step 5: Physical Impact -->
  <g transform="translate(750, 80)">
    <rect width="145" height="150" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <rect width="145" height="35" rx="10" fill="#b91c1c"/>
    <text x="72" y="22" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5. FİZİKSEL HASAR</text>
    <text x="12" y="58" fill="#fca5a5" font-size="10" font-weight="600">• Impact</text>
    <text x="12" y="74" fill="#ffffff" font-size="9">Trafo / Kesici İnfilakı</text>
    <text x="12" y="90" fill="#ffffff" font-size="9">Bölgesel Elektrik Kesintisi</text>
    <text x="12" y="106" fill="#ffffff" font-size="9">Fiziksel Ekipman Tahribatı</text>
    <text x="12" y="126" fill="#fecaca" font-size="9">Hedef: Seviye 0 (Süreç)</text>
  </g>
</svg>
