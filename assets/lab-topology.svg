<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="plcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="auditGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="700" letter-spacing="1">DOCKER OT GÜVENLİK TEST LABORATUVARI MİMARİSİ</text>
  <text x="450" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">İzole Köprü Ağı (Subnet: 172.28.0.0/16)</text>

  <!-- Docker Network Box -->
  <rect x="30" y="75" width="840" height="315" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="50" y="102" fill="#64748b" font-size="12" font-weight="600">DOCKER KÖPRÜ AĞI: ot_network (172.28.0.0/16)</text>

  <!-- Container 1: Modbus PLC -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="230" height="220" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <rect width="230" height="42" rx="10" fill="url(#plcGrad)"/>
    <text x="115" y="26" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">🏭 SIMÜLE SU DEPOSU PLC</text>
    
    <text x="20" y="65" fill="#38bdf8" font-size="11" font-weight="600">Konteyner: ot_modbus_plc</text>
    <text x="20" y="85" fill="#f8fafc" font-size="11">IP: 172.28.0.10</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="10">Host Portu: 5020:502/TCP</text>
    <line x1="20" y1="115" x2="210" y2="115" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="135" fill="#94a3b8" font-size="10">Bellek Haritası:</text>
    <text x="20" y="152" fill="#a5f3fc" font-size="10">• Coil 0: Su Pompası (On/Off)</text>
    <text x="20" y="168" fill="#a5f3fc" font-size="10">• Coil 1: Boşaltma Vanası</text>
    <text x="20" y="184" fill="#a5f3fc" font-size="10">• Reg 0: Su Seviyesi (Litre)</text>
    <text x="20" y="200" fill="#a5f3fc" font-size="10">• Reg 1: Boru Basıncı (PSI)</text>
  </g>

  <!-- Container 2: Conpot Honeypot -->
  <g transform="translate(335, 130)" filter="url(#shadow)">
    <rect width="230" height="220" rx="10" fill="#1e293b" stroke="#ea580c" stroke-width="2"/>
    <rect width="230" height="42" rx="10" fill="url(#hpGrad)"/>
    <text x="115" y="26" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">🍯 CONPOT HONEYPOT</text>
    
    <text x="20" y="65" fill="#fb923c" font-size="11" font-weight="600">Konteyner: ot_conpot_honeypot</text>
    <text x="20" y="85" fill="#f8fafc" font-size="11">IP: 172.28.0.20</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="10">Host Portları: 1020, 5021</text>
    <line x1="20" y1="115" x2="210" y2="115" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="135" fill="#94a3b8" font-size="10">Simüle Servisler:</text>
    <text x="20" y="152" fill="#fed7aa" font-size="10">• Siemens S7comm (Port 102)</text>
    <text x="20" y="168" fill="#fed7aa" font-size="10">• Modbus TCP (Port 502)</text>
    <text x="20" y="184" fill="#fed7aa" font-size="10">• BACnet Bina (UDP 47808)</text>
    <text x="20" y="200" fill="#fed7aa" font-size="10">• IPMI Sunucu Yönetimi</text>
  </g>

  <!-- Container 3: Auditor Tooling -->
  <g transform="translate(610, 130)" filter="url(#shadow)">
    <rect width="230" height="220" rx="10" fill="#1e293b" stroke="#059669" stroke-width="2"/>
    <rect width="230" height="42" rx="10" fill="url(#auditGrad)"/>
    <text x="115" y="26" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">🎯 GÜVENLİK İSTEMCİSİ</text>
    
    <text x="20" y="65" fill="#34d399" font-size="11" font-weight="600">Konteyner: ot_security_auditor</text>
    <text x="20" y="85" fill="#f8fafc" font-size="11">IP: 172.28.0.30</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="10">Dizin: /scripts</text>
    <line x1="20" y1="115" x2="210" y2="115" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="135" fill="#94a3b8" font-size="10">Çalıştırılabilir Araçlar:</text>
    <text x="20" y="152" fill="#a7f3d0" font-size="10">• modbus_auditor.py</text>
    <text x="20" y="168" fill="#a7f3d0" font-size="10">• s7_recon.py</text>
    <text x="20" y="184" fill="#a7f3d0" font-size="10">• dnp3_audit.py</text>
    <text x="20" y="200" fill="#a7f3d0" font-size="10">• ot_pcap_hunter.py</text>
  </g>

  <!-- Traffic Arrows -->
  <path d="M 610 220 L 565 220" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 610 240 L 290 240" stroke="#34d399" stroke-width="2" stroke-dasharray="4,3"/>
</svg>
