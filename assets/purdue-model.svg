<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#0b1120; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="grad-l5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="grad-idmz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="grad-l3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-l2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="grad-l1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="grad-l0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="700" letter-spacing="1.5">PURDUE KURUMSAL REFERANS MİMARİSİ (PERA / ISA-95)</text>
  <text x="480" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Endüstriyel Kontrol Sistemleri Hiyerarşik Segmentasyon ve Güvenlik Modeli</text>

  <!-- Level 5 & 4: Enterprise -->
  <rect x="40" y="75" width="880" height="65" rx="8" fill="url(#grad-l5)" stroke="#64748b" stroke-width="1.5"/>
  <rect x="55" y="87" width="130" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="120" y="105" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">SEVİYE 4 &amp; 5</text>
  <text x="120" y="120" text-anchor="middle" fill="#94a3b8" font-size="10">Enterprise</text>
  <text x="210" y="104" fill="#f8fafc" font-size="13" font-weight="600">Kurumsal İş Ağı &amp; Bulut Sistemleri</text>
  <text x="210" y="122" fill="#94a3b8" font-size="11">ERP, CRM, İş Zekası (BI), Kurumsal E-posta, Tesis Lojistiği, Web ve Genel İnternet Çıkışı</text>

  <!-- Firewall Barrier 1: IT / IDMZ Firewall -->
  <line x1="60" y1="152" x2="900" y2="152" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="380" y="142" width="200" height="20" rx="10" fill="#dc2626"/>
  <text x="480" y="156" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700" letter-spacing="1">🛡️ KURUMSAL GÜVENLİK DUVARI</text>

  <!-- Level 3.5: IDMZ -->
  <rect x="40" y="172" width="880" height="70" rx="8" fill="url(#grad-idmz)" stroke="#f97316" stroke-width="2" filter="url(#glow)"/>
  <rect x="55" y="185" width="130" height="44" rx="6" fill="#431407" stroke="#fb923c" stroke-width="1.5"/>
  <text x="120" y="204" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="700">SEVİYE 3.5</text>
  <text x="120" y="220" text-anchor="middle" fill="#fdba74" font-size="10">Endüstriyel DMZ</text>
  <text x="210" y="202" fill="#ffffff" font-size="14" font-weight="700">IDMZ (Industrial Demilitarized Zone) - Güvenlik Tamponu</text>
  <text x="210" y="222" fill="#ffedd5" font-size="11">MFA Jump Host (PAM), OT Replica Historian, WSUS Yama Dağıtımı, AV Sunucuları (Çift Taraflı İzolasyon)</text>

  <!-- Firewall Barrier 2: IDMZ / OT Firewall -->
  <line x1="60" y1="254" x2="900" y2="254" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="390" y="244" width="180" height="20" rx="10" fill="#ea580c"/>
  <text x="480" y="258" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700" letter-spacing="1">🔥 OT GÜVENLİK DUVARI</text>

  <!-- Level 3: Site Operations -->
  <rect x="40" y="274" width="880" height="65" rx="8" fill="url(#grad-l3)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="55" y="286" width="130" height="40" rx="6" fill="#022c22" stroke="#34d399" stroke-width="1"/>
  <text x="120" y="304" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">SEVİYE 3</text>
  <text x="120" y="319" text-anchor="middle" fill="#a7f3d0" font-size="10">Operations</text>
  <text x="210" y="303" fill="#ffffff" font-size="13" font-weight="600">Saha Operasyonları Yönetimi &amp; MES</text>
  <text x="210" y="321" fill="#d1fae5" font-size="11">SCADA Sunucuları, Mühendislik İstasyonları (EWS), MES, Alarm Yönetimi, Pasif NDR Sensörleri (Zeek/Malcolm)</text>

  <!-- Level 2: Supervisory Control -->
  <rect x="40" y="350" width="880" height="65" rx="8" fill="url(#grad-l2)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="55" y="362" width="130" height="40" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
  <text x="120" y="380" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">SEVİYE 2</text>
  <text x="120" y="395" text-anchor="middle" fill="#bae6fd" font-size="10">Control</text>
  <text x="210" y="379" fill="#ffffff" font-size="13" font-weight="600">Saha Kontrolü ve Operatör Gözetimi</text>
  <text x="210" y="397" fill="#e0f2fe" font-size="11">HMI (İnsan-Makine Arayüzü), Operatör Masaları, Dokunmatik Paneller, Bölgesel Veri Toplayıcılar</text>

  <!-- Level 1: Basic Control -->
  <rect x="40" y="426" width="880" height="75" rx="8" fill="url(#grad-l1)" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="55" y="441" width="130" height="44" rx="6" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="1"/>
  <text x="120" y="460" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="700">SEVİYE 1</text>
  <text x="120" y="476" text-anchor="middle" fill="#c7d2fe" font-size="10">Basic Control</text>
  <text x="210" y="456" fill="#ffffff" font-size="13" font-weight="600">Temel Mantıksal Kontrol (PLC / RTU / IED)</text>
  <text x="210" y="474" fill="#e0e7ff" font-size="11">PLC (Siemens, Rockwell, Schneider), RTU, IED (Trafo Koruma Rölesi), SIS (Emniyet Kontrolörü Triconex)</text>
  <text x="210" y="490" fill="#a5b4fc" font-size="10">Protokoller: Modbus TCP (502), S7comm (102), DNP3 (20000), IEC-104 (2404), Profinet RT, GOOSE</text>

  <!-- Level 0: Physical Process -->
  <rect x="40" y="512" width="880" height="65" rx="8" fill="url(#grad-l0)" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="55" y="524" width="130" height="40" rx="6" fill="#3b0764" stroke="#d8b4fe" stroke-width="1"/>
  <text x="120" y="542" text-anchor="middle" fill="#d8b4fe" font-size="12" font-weight="700">SEVİYE 0</text>
  <text x="120" y="557" text-anchor="middle" fill="#f3e8ff" font-size="10">Process</text>
  <text x="210" y="541" fill="#ffffff" font-size="13" font-weight="600">Fiziksel Süreç ve Saha Ekipmanları</text>
  <text x="210" y="559" fill="#fae8ff" font-size="11">Sensörler (Basınç, Sıcaklık, Akış, Seviye), Aktüatörler, Pompalar, Motorlar, Vanalar, Kesiciler (4-20mA, 24V I/O)</text>

  <!-- Footer Notice -->
  <text x="480" y="602" text-anchor="middle" fill="#64748b" font-size="11">⚠️ Altın Kural: Seviye 4/5 ağından doğrudan Seviye 1/2 cihazlarına tek bir paket dahi yönlendirilemez.</text>
</svg>
