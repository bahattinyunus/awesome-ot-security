name: CI - OT Security Toolkit Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Syntax & Integrity Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Validate Python Scripts Syntax
        run: |
          python -m py_compile arsenal.py
          python -m py_compile scripts/*.py
          python -m py_compile labs/modbus-sim/*.py
          python -m py_compile labs/hmi-dashboard/*.py

      - name: Test Synthetic PCAP Generation
        run: |
          python scripts/generate_sample_pcap.py test_sample.pcap
          test -s test_sample.pcap && echo "PCAP generation test PASSED!"
